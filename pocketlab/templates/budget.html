{% extends 'base.html' %}
{% block content %}
<h1>Budget overview</h1>
<div class="cards">
  <div class="card">
    <h2>Budget</h2>
    <p>${{ '%.2f' % summary.total_spend }}</p>
  </div>
  <div class="card">
    <h2>Transactions</h2>
    <p>{{ summary.transaction_count }}</p>
  </div>
</div>
<ul>
  {% for row in categories %}
  <li>{{ row.category }}: ${{ '%.2f' % row.total }}</li>
  {% endfor %}
</ul>
{% endblock %}
